services:

    shared-backend:
        build:
            context: ./shared/backend
            dockerfile: Api/Dockerfile
        ports:
            - "5110:8080"
        volumes:
            - shared-db:/app/Data
        env_file:
            - path: .env
              required: false
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            CANVAS_BASE_URL: ${CANVAS_BASE_URL:-https://your-institution.instructure.com}
            CANVAS_API_TOKEN: ${CANVAS_API_TOKEN:-}
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/ready"]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 15s

    student-1-database:
        build:
            context: ./student-1/database
            dockerfile: Dockerfile
        ports:
            - "5432:5432"
        environment:
            POSTGRES_DB: notifications_db
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        volumes:
            - student-1-postgres-data:/var/lib/postgresql/data
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "pg_isready", "-U", "postgres", "-d", "notifications_db"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    student-1-backend:
        build:
            context: ./student-1/backend
            dockerfile: Api/Dockerfile
        ports:
            - "5101:8080"
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            ConnectionStrings__DefaultConnection: Host=student-1-database;Port=5432;Database=notifications_db;Username=postgres;Password=postgres
            Cors__AllowedOrigins__0: http://localhost:3000
            Cors__AllowedOrigins__1: http://localhost:8080
            Cors__AllowedOrigins__2: http://localhost:5173
            Cors__AllowedOrigins__3: http://localhost:5174
            Cors__AllowedOrigins__4: http://localhost:5199
            SharedService__BaseUrl: http://shared-backend:8080
            AiGateway__BaseUrl: http://ai-mode:8080
            CanvasSync__IntervalMinutes: "2"
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/ready"]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 15s
        depends_on:
            student-1-database:
                condition: service_healthy
            shared-backend:
                condition: service_healthy
            ai-mode:
                condition: service_healthy

    student-2-backend:
        build:
            context: ./student-2/backend
            dockerfile: Api/Dockerfile
        ports:
            - "5102:8080"
        volumes:
            - student-2-db:/app/Data
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            Cors__AllowedOrigins__0: http://localhost:3002
            Cors__AllowedOrigins__1: http://localhost:8080
            SharedService__BaseUrl: http://shared-backend:8080
            AiGateway__BaseUrl: http://ai-mode:8080
            NotificationService__BaseUrl: http://student-1-backend:8080
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/ready"]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 15s
        depends_on:
            shared-backend:
                condition: service_healthy
            ai-mode:
                condition: service_healthy

    student-3-database:
        build:
            context: ./student-3
            dockerfile: database/Database/Dockerfile
        volumes:
            - student-3-db:/app/Data
        environment:
            ASPNETCORE_ENVIRONMENT: Development
        networks:
            - student-3-data
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/ready"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s

    student-3-backend:
        build:
            context: ./student-3
            dockerfile: backend/Api/Dockerfile
        ports:
            - "5103:8080"
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            DatabaseService__BaseUrl: http://student-3-database:8080
            SharedService__BaseUrl: http://shared-backend:8080
            AiGateway__BaseUrl: http://ai-mode:8080
            NotificationService__BaseUrl: http://student-1-backend:8080
            DueSoonReminder__IntervalMinutes: "15"
            DueSoonReminder__HoursBeforeDue: "24"
            DueSoonReminder__FinalHoursBeforeDue: "3"
        networks:
            - default
            - student-3-data
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/ready"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s
        depends_on:
            student-3-database:
                condition: service_healthy
            shared-backend:
                condition: service_healthy
            ai-mode:
                condition: service_healthy

    student-4-database:
        build:
            context: ./student-4
            dockerfile: database/Database/Dockerfile
        volumes:
            - student-4-db:/app/Data
        environment:
            ASPNETCORE_ENVIRONMENT: Development
        networks:
            - student-4-data
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/ready"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s

    student-4-backend:
        build:
            context: ./student-4
            dockerfile: backend/Api/Dockerfile
        ports:
            - "5104:8080"
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            DatabaseService__BaseUrl: http://student-4-database:8080
            AiGateway__BaseUrl: http://ai-mode:8080
            NotificationService__BaseUrl: http://student-1-backend:8080
        networks:
            - default
            - student-4-data
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/ready"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s
        depends_on:
            student-4-database:
                condition: service_healthy
            shared-backend:
                condition: service_healthy
            ai-mode:
                condition: service_healthy
            mailhog:
                condition: service_started

    student-4-authentication:
        build:
            context: ./student-4
            dockerfile: authentication/Authentication/Dockerfile
        ports:
            - "5114:8080"
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            DatabaseService__BaseUrl: http://student-4-database:8080
            NotificationService__BaseUrl: http://student-1-backend:8080
            Email__Smtp__Host: mailhog
            Email__Smtp__Port: "1025"
            Email__Smtp__UseSsl: "false"
            Email__FromAddress: no-reply@student4.local
            Email__FromName: Student 4 Account Service
            Email__PasswordReset__BaseUrl: http://localhost:8080/account/reset-password
            Email__PasswordReset__TokenLifetimeMinutes: "60"
        networks:
            - default
            - student-4-data
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/ready"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s
        depends_on:
            student-4-database:
                condition: service_healthy
            mailhog:
                condition: service_started

    student-5-database:
        build:
            context: ./student-5
            dockerfile: database/Database/Dockerfile
        volumes:
            - student-5-db:/app/Data
        environment:
            ASPNETCORE_ENVIRONMENT: Development
        networks:
            - student-5-data
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/ready"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s

    student-5-backend:
        build:
            context: ./student-5
            dockerfile: backend/GradesManager/GradesManager/Dockerfile
        ports:
            - "5105:8080"
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            DatabaseService__BaseUrl: http://student-5-database:8080
            AiGateway__BaseUrl: http://ai-mode:8080
            NotificationService__BaseUrl: http://student-1-backend:8080
        networks:
            - default
            - student-5-data
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/ready"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s
        depends_on:
            student-5-database:
                condition: service_healthy
            ai-mode:
                condition: service_healthy

    student-1-frontend:
        build:
            context: .
            dockerfile: student-1/frontend/Dockerfile
            
    student-2-frontend:
        build:
            context: .
            dockerfile: student-2/frontend/Dockerfile

    student-3-frontend:
        build:
            context: .
            dockerfile: student-3/frontend/Dockerfile

    student-4-frontend:
        build:
            context: .
            dockerfile: student-4/frontend/Dockerfile

    student-5-frontend:
        build:
            context: .
            dockerfile: student-5/frontend/Dockerfile

    ai-mode:
        build:
            context: ./ai-services/ai-mode
            dockerfile: Api/Dockerfile
        env_file:
            - path: .env
              required: false
        environment:
            ASPNETCORE_ENVIRONMENT: Development
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/ready"]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 10s

    mailhog:
        image: mailhog/mailhog:latest
        ports:
            - "1025:1025"   # SMTP
            - "8025:8025"   # Web UI
        restart: unless-stopped

    shared-shell:
        build:
            context: .
            dockerfile: shared/frontend/Dockerfile
        ports:
            - "8080:80"
        depends_on:
            student-1-frontend:
                condition: service_started
            student-1-backend:
                condition: service_healthy
            student-2-frontend:
                condition: service_started
            student-2-backend:
                condition: service_healthy
            student-3-frontend:
                condition: service_started
            student-3-backend:
                condition: service_healthy
            student-4-frontend:
                condition: service_started
            student-4-backend:
                condition: service_healthy
            student-4-authentication:
                condition: service_healthy
            student-5-frontend:
                condition: service_started
            student-5-backend:
                condition: service_started

volumes:
    shared-db:
    student-1-postgres-data:
    student-1-db:
    student-2-db:
    student-3-db:
    student-4-db:
    student-5-db:

networks:
    default:
    student-3-data:
        internal: true
    student-4-data:
        internal: true
    student-5-data:
        internal: true
