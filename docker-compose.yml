services:

    shared-backend:
        build:
            context: ./shared/backend
            dockerfile: Api/Dockerfile
        ports:
            - "5110:8080"
        volumes:
            - shared-db:/app/Data
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            CANVAS_BASE_URL: ${CANVAS_BASE_URL}
            CANVAS_API_TOKEN: ${CANVAS_API_TOKEN}
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/ready"]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 15s

    student-1-backend:
        build:
            context: ./student-1/backend
            dockerfile: Api/Dockerfile
        ports:
            - "5101:8080"
        volumes:
            - student-1-db:/app/Data
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            Cors__AllowedOrigins__0: http://localhost:3000
            Cors__AllowedOrigins__1: http://localhost:8080
            Cors__AllowedOrigins__2: http://localhost:5173
            Cors__AllowedOrigins__3: http://localhost:5174
            Cors__AllowedOrigins__4: http://localhost:5199
            SharedService__BaseUrl: http://shared-backend:8080
            CanvasSync__IntervalMinutes: "2"
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/live"]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 15s
        depends_on:
            shared-backend:
                condition: service_healthy

    student-3-backend:
        build:
            context: ./student-3/backend
            dockerfile: Api/Dockerfile
        ports:
            - "5103:8080"
        volumes:
            - student-3-db:/app/Data
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            SharedService__BaseUrl: http://shared-backend:8080
            AiGateway__BaseUrl: http://ai-mode:8080
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/ready"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s
        depends_on:
            shared-backend:
                condition: service_healthy
            ai-mode:
                condition: service_healthy

    student-5-backend:
        build:
            context: ./student-5/backend/GradesManager
            dockerfile: GradesManager/Dockerfile
        ports:
            - "5105:8080"
        volumes:
            - student-5-db:/app/Data
        environment:
            ASPNETCORE_ENVIRONMENT: Development

    student-1-frontend:
        build:
            context: .
            dockerfile: student-1/frontend/Dockerfile

    student-3-frontend:
        build:
            context: .
            dockerfile: student-3/frontend/Dockerfile

    student-5-frontend:
        build:
            context: .
            dockerfile: student-5/frontend/Dockerfile

    ai-mode:
        build:
            context: ./ai-services/ai-mode
            dockerfile: Api/Dockerfile
        environment:
            OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/ready"]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 10s

    shared-shell:
        build:
            context: .
            dockerfile: shared/frontend/Dockerfile
        ports:
            - "8080:80"
        depends_on:
            student-1-frontend:
                condition: service_started
            student-1-backend:
                condition: service_healthy
            student-3-frontend:
                condition: service_started
            student-3-backend:
                condition: service_healthy
            student-5-frontend:
                condition: service_started
            student-5-backend:
                condition: service_started

volumes:
    shared-db:
    student-1-db:
    student-3-db:
    student-5-db:
