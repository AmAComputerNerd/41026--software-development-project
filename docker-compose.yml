services:

    ai-mode:
        build:
            context: ./ai-services/ai-mode
            dockerfile: Api/Dockerfile
        networks:
            - ai-services
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
            OPENROUTER_MODEL: ${OPENROUTER_MODEL:?Run python tools/setup_env.py}
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/ready"]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 15s

    mcp-server:
        build:
            context: ./ai-services/mcp-server
            dockerfile: McpServer/Dockerfile
        networks:
            - ai-services
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            Student1__BaseUrl: http://student-1-backend:8080
            Student2__BaseUrl: http://student-2-backend:8080
            Student3__BaseUrl: http://student-3-backend:8080
            Student4__BaseUrl: http://student-4-backend:8080
            Student5__BaseUrl: http://student-5-backend:8080
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/ready"]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 15s

    rag-server:
        build:
            context: .
            dockerfile: ai-services/rag-server/RagServer/Dockerfile
        networks:
            - ai-services
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            AiGateway__BaseUrl: http://ai-mode:8080
            Rag__CorpusPath: /app/Corpus
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/ready"]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 15s

    shared-backend:
        build:
            context: ./shared/backend
            dockerfile: Api/Dockerfile
        ports:
            - "5110:8080"
        volumes:
            - shared-db:/app/Data
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            CANVAS_BASE_URL: ${CANVAS_BASE_URL:?Run python tools/setup_env.py}
            CANVAS_API_TOKEN: ${CANVAS_API_TOKEN}
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/ready"]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 15s

    student-1-database:
        build:
            context: ./student-1/database
            dockerfile: Dockerfile
        ports:
            - "5432:5432"
        environment:
            POSTGRES_DB: notifications_db
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python tools/setup_env.py}
        volumes:
            - student-1-postgres-data:/var/lib/postgresql/data
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "pg_isready", "-U", "postgres", "-d", "notifications_db"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    student-1-backend:
        build:
            context: ./student-1/backend
            dockerfile: Api/Dockerfile
        ports:
            - "5101:8080"
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            ConnectionStrings__DefaultConnection: Host=student-1-database;Port=5432;Database=notifications_db;Username=postgres;Password=${POSTGRES_PASSWORD:?Run python tools/setup_env.py}
            Cors__AllowedOrigins__0: http://localhost:3000
            Cors__AllowedOrigins__1: http://localhost:8080
            Cors__AllowedOrigins__2: http://localhost:5173
            Cors__AllowedOrigins__3: http://localhost:5174
            Cors__AllowedOrigins__4: http://localhost:5199
            SharedService__BaseUrl: http://shared-backend:8080
            AiGateway__BaseUrl: http://ai-mode:8080
            McpServer__Enabled: ${MCP_ENABLED:?Run python tools/setup_env.py}
            McpServer__BaseUrl: http://mcp-server:8080/mcp
            RagServer__Enabled: ${RAG_ENABLED:?Run python tools/setup_env.py}
            RagServer__BaseUrl: http://rag-server:8080
            MultiAgentServer__Enabled: ${MULTI_AGENT_ENABLED:-false}
            MultiAgentServer__BaseUrl: http://host.docker.internal:${MULTI_AGENT_HOST_PORT:-5004}
            CanvasSync__IntervalMinutes: "2"
        networks:
            - default
            - ai-services
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/ready"]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 15s
        depends_on:
            student-1-database:
                condition: service_healthy
            shared-backend:
                condition: service_healthy

    student-2-backend:
        build:
            context: ./student-2/backend
            dockerfile: Api/Dockerfile
        ports:
            - "5102:8080"
        volumes:
            - student-2-db:/app/Data
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            Cors__AllowedOrigins__0: http://localhost:3002
            Cors__AllowedOrigins__1: http://localhost:8080
            SharedService__BaseUrl: http://shared-backend:8080
            AiGateway__Enabled: "true"
            AiGateway__BaseUrl: http://ai-mode:8080
            NotificationService__BaseUrl: http://student-1-backend:8080
            McpServer__Enabled: ${MCP_ENABLED:?Run python tools/setup_env.py}
            McpServer__BaseUrl: http://mcp-server:8080/mcp
            RagServer__Enabled: ${RAG_ENABLED:?Run python tools/setup_env.py}
            RagServer__BaseUrl: http://rag-server:8080
        networks:
            - default
            - ai-services
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/ready"]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 15s
        depends_on:
            shared-backend:
                condition: service_healthy

    student-3-database:
        build:
            context: ./student-3
            dockerfile: database/Database/Dockerfile
        volumes:
            - student-3-db:/app/Data
        environment:
            ASPNETCORE_ENVIRONMENT: Development
        networks:
            - student-3-data
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/ready"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s

    student-3-backend:
        build:
            context: ./student-3
            dockerfile: backend/Api/Dockerfile
        ports:
            - "5103:8080"
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            DatabaseService__BaseUrl: http://student-3-database:8080
            SharedService__BaseUrl: http://shared-backend:8080
            AiGateway__Enabled: ${AI_MODE_ENABLED:?Run python tools/setup_env.py}
            AiGateway__BaseUrl: http://ai-mode:8080
            NotificationService__BaseUrl: http://student-1-backend:8080
            McpServer__Enabled: ${MCP_ENABLED:?Run python tools/setup_env.py}
            McpServer__BaseUrl: http://mcp-server:8080/mcp
            RagServer__Enabled: ${RAG_ENABLED:?Run python tools/setup_env.py}
            RagServer__BaseUrl: http://rag-server:8080
            DueSoonReminder__IntervalMinutes: "15"
            MultiAgentServer__Enabled: ${MULTI_AGENT_ENABLED:?Run python tools/setup_env.py}
            MultiAgentServer__BaseUrl: http://host.docker.internal:${MULTI_AGENT_HOST_PORT:-5004}
            DueSoonReminder__HoursBeforeDue: "24"
            DueSoonReminder__FinalHoursBeforeDue: "3"
        extra_hosts:
            - "host.docker.internal:host-gateway"
        networks:
            - default
            - ai-services
            - student-3-data
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/ready"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s
        depends_on:
            student-3-database:
                condition: service_healthy

    student-4-database:
        build:
            context: ./student-4
            dockerfile: database/Database/Dockerfile
        volumes:
            - student-4-db:/app/Data
        environment:
            ASPNETCORE_ENVIRONMENT: Development
        networks:
            - student-4-data
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/ready"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s

    student-4-backend:
        build:
            context: ./student-4
            dockerfile: backend/Api/Dockerfile
        ports:
            - "5104:8080"
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            DatabaseService__BaseUrl: http://student-4-database:8080
            SharedService__BaseUrl: http://shared-backend:8080
            AiGateway__BaseUrl: http://ai-mode:8080
            McpServer__Enabled: ${MCP_ENABLED:?Run python tools/setup_env.py}
            McpServer__BaseUrl: http://mcp-server:8080/mcp
            RagServer__Enabled: ${RAG_ENABLED:?Run python tools/setup_env.py}
            RagServer__BaseUrl: http://rag-server:8080
            NotificationService__BaseUrl: http://student-1-backend:8080
        networks:
            - default
            - ai-services
            - student-4-data
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/ready"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s
        depends_on:
            student-4-database:
                condition: service_healthy
            shared-backend:
                condition: service_healthy
            mailhog:
                condition: service_started

    student-4-authentication:
        build:
            context: ./student-4
            dockerfile: authentication/Authentication/Dockerfile
        ports:
            - "5114:8080"
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            DatabaseService__BaseUrl: http://student-4-database:8080
            NotificationService__BaseUrl: http://student-1-backend:8080
            SMTP_HOST: ${SMTP_HOST:-}
            SMTP_PORT: ${SMTP_PORT:-}
            SMTP_USERNAME: ${SMTP_USERNAME:-}
            SMTP_PASSWORD: ${SMTP_PASSWORD:-}
            SMTP_USE_SSL: ${SMTP_USE_SSL:-}
            SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
            SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
        networks:
            - default
            - student-4-data
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/ready"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s
        depends_on:
            student-4-database:
                condition: service_healthy
            mailhog:
                condition: service_started

    student-5-database:
        build:
            context: ./student-5
            dockerfile: database/Database/Dockerfile
        volumes:
            - student-5-db:/app/Data
        environment:
            ASPNETCORE_ENVIRONMENT: Development
        networks:
            - student-5-data
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/ready"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s

    student-5-backend:
        build:
            context: ./student-5
            dockerfile: backend/GradesManager/GradesManager/Dockerfile
        ports:
            - "5105:8080"
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            DatabaseService__BaseUrl: http://student-5-database:8080
            AiGateway__BaseUrl: http://ai-mode:8080
            NotificationService__BaseUrl: http://student-1-backend:8080
            McpServer__Enabled: ${MCP_ENABLED:?Run python tools/setup_env.py}
            McpServer__BaseUrl: http://mcp-server:8080/mcp
            RagServer__Enabled: ${RAG_ENABLED:?Run python tools/setup_env.py}
            RagServer__BaseUrl: http://rag-server:8080
        networks:
            - default
            - ai-services
            - student-5-data
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/ready"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s
        depends_on:
            student-5-database:
                condition: service_healthy

    student-1-frontend:
        build:
            context: .
            dockerfile: student-1/frontend/Dockerfile
            
    student-2-frontend:
        build:
            context: .
            dockerfile: student-2/frontend/Dockerfile

    student-3-frontend:
        build:
            context: .
            dockerfile: student-3/frontend/Dockerfile

    student-4-frontend:
        build:
            context: .
            dockerfile: student-4/frontend/Dockerfile

    student-5-frontend:
        build:
            context: .
            dockerfile: student-5/frontend/Dockerfile

    mailhog:
        image: mailhog/mailhog:latest
        ports:
            - "1025:1025"   # SMTP
            - "8025:8025"   # Web UI
        restart: unless-stopped

    shared-shell:
        build:
            context: .
            dockerfile: shared/frontend/Dockerfile
        ports:
            - "8080:80"
        depends_on:
            student-1-frontend:
                condition: service_started
            student-1-backend:
                condition: service_healthy
            student-2-frontend:
                condition: service_started
            student-2-backend:
                condition: service_healthy
            student-3-frontend:
                condition: service_started
            student-3-backend:
                condition: service_healthy
            student-4-frontend:
                condition: service_started
            student-4-backend:
                condition: service_healthy
            student-4-authentication:
                condition: service_healthy
            student-5-frontend:
                condition: service_started
            student-5-backend:
                condition: service_started

volumes:
    shared-db:
    student-1-postgres-data:
    student-1-db:
    student-2-db:
    student-3-db:
    student-4-db:
    student-5-db:

networks:
    default:
    ai-services:
    student-3-data:
        internal: true
    student-4-data:
        internal: true
    student-5-data:
        internal: true
