services:

    shared-backend:
        build:
            context: ./shared/backend
            dockerfile: Api/Dockerfile
        ports:
            - "5110:8080"
        volumes:
            - shared-db:/app/Data
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            CANVAS_BASE_URL: ${CANVAS_BASE_URL}
            CANVAS_API_TOKEN: ${CANVAS_API_TOKEN}
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/ready"]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 15s

    student-1-backend:
        build:
            context: ./student-1/backend
            dockerfile: Api/Dockerfile
        ports:
            - "5101:8080"
        volumes:
            - student-1-db:/app/Data
        environment:
            ASPNETCORE_ENVIRONMENT: Development
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/ready"]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 15s

    student-2-backend:
        build:
            context: ./student-2/backend
            dockerfile: Api/Dockerfile
        ports:
            - "5102:8080"
        volumes:
            - student-2-db:/app/Data
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            Cors__AllowedOrigins__0: http://localhost:3002
            Cors__AllowedOrigins__1: http://localhost:8080
            SharedService__BaseUrl: http://shared-backend:8080
            AiGateway__BaseUrl: http://ai-mode:8080
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/ready"]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 15s
        depends_on:
            shared-backend:
                condition: service_healthy
            ai-mode:
                condition: service_healthy

    student-3-database:
        build:
            context: ./student-3
            dockerfile: database/Database/Dockerfile
        volumes:
            - student-3-db:/app/Data
        environment:
            ASPNETCORE_ENVIRONMENT: Development
        networks:
            - student-3-data
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/ready"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s

    student-3-backend:
        build:
            context: ./student-3
            dockerfile: backend/Api/Dockerfile
        ports:
            - "5103:8080"
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            DatabaseService__BaseUrl: http://student-3-database:8080
            SharedService__BaseUrl: http://shared-backend:8080
            AiGateway__BaseUrl: http://ai-mode:8080
            NotificationService__BaseUrl: http://student-1-backend:8080
            DueSoonReminder__IntervalMinutes: "15"
            DueSoonReminder__HoursBeforeDue: "24"
            DueSoonReminder__FinalHoursBeforeDue: "3"
        networks:
            - default
            - student-3-data
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/ready"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s
        depends_on:
            student-3-database:
                condition: service_healthy
            shared-backend:
                condition: service_healthy
            ai-mode:
                condition: service_healthy

    student-4-backend:
        build:
            context: ./student-4/backend
            dockerfile: Api/Dockerfile
        ports:
            - "5104:8080"
        volumes:
            - student-4-db:/app/Data
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            AiGateway__BaseUrl: http://ai-mode:8080
            NotificationService__BaseUrl: http://student-4-backend:8080
            DueSoonReminder__IntervalMinutes: "15"
            DueSoonReminder__HoursBeforeDue: "24"
            DueSoonReminder__FinalHoursBeforeDue: "3"
        networks:
            - default
            - student-4-data
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/ready"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s
        depends_on:
            shared-backend:
                condition: service_healthy
            ai-mode:
                condition: service_healthy

    student-4-frontend:
        build:
            context: .
            dockerfile: student-4/frontend/Dockerfile

    student-1-frontend:
        build:
            context: .
            dockerfile: student-1/frontend/Dockerfile

    student-3-frontend:
        build:
            context: .
            dockerfile: student-3/frontend/Dockerfile

    ai-mode:
        build:
            context: ./ai-services/ai-mode
            dockerfile: Api/Dockerfile
        environment:
            OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/ready"]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 15s

    shared-shell:
        build:
            context: .
            dockerfile: shared/frontend/Dockerfile
        ports:
            - "8080:80"
        depends_on:
            - student-1-frontend
            - student-1-backend
            - student-3-frontend
            - student-3-backend
            - student-4-frontend
            - student-4-backend

volumes:
    shared-db:
    student-1-db:
    student-2-db:
    student-3-db:
    student-4-db:
    student-5-db:

networks:
    default:
    student-3-data:
        internal: true
    student-4-data:
        internal: true
