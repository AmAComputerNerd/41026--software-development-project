server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Notifications frontend (student-1)
    location /notifications/ {
        proxy_pass http://student-1-frontend:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Notifications API (student-1 backend)
    location /api/notifications/ {
        proxy_pass http://student-1-backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Deadlines/Task Tracker frontend not built yet -- fall back to shell app for now.
    location /deadlines {
        return 302 /;
    }

