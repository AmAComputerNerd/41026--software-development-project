resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Notifications frontend (student-1)
    location = /notifications {
        return 301 /notifications/;
    }

    location /notifications/ {
        set $upstream_s1_fe "http://student-1-frontend:80";
        rewrite ^/notifications/(.*)$ /$1 break;
        proxy_pass $upstream_s1_fe;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Notifications API (student-1 backend)
    location /api/notifications/ {
        set $upstream_s1_be "http://student-1-backend:8080";
        rewrite ^/api/notifications/(.*)$ /$1 break;
        proxy_pass $upstream_s1_be;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 120s;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Automations frontend (student-2)
    location = /automations {
        return 301 /automations/;
    }
    
    # Automations backend (student-2)
    location /automations/ {
        set $upstream_s2_fe "http://student-2-frontend:80";
        rewrite ^/automations/(.*)$ /$1 break;
        proxy_pass $upstream_s2_fe;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/automations/ {
        set $upstream_s2_be "http://student-2-backend:8080";
        rewrite ^/api/automations/(.*)$ /api/$1 break;
        proxy_pass $upstream_s2_be;
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 120s;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Deadlines and Task Tracker frontend (student-3)
    location = /deadlines {
        return 301 /deadlines/;
    }

    location /deadlines/ {
        set $upstream_s3_fe "http://student-3-frontend:80";
        rewrite ^/deadlines/(.*)$ /$1 break;
        proxy_pass $upstream_s3_fe;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Deadlines and Task Tracker API (student-3 backend)
    location /api/deadlines/ {
        set $upstream_s3_be "http://student-3-backend:8080";
        rewrite ^/api/deadlines/(.*)$ /api/$1 break;
        proxy_pass $upstream_s3_be;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 210s;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Account frontend (student-4)
    location = /account {
        return 301 /account/;
    }

    # Account and Authentication API (student-4 backend)
    location /account/ {
        set $upstream_s4_fe "http://student-4-frontend:80";
        rewrite ^/account/(.*)$ /$1 break;
        proxy_pass $upstream_s4_fe;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location /api/auth/ {
        set $upstream_s4_auth "http://student-4-authentication:8080";
        proxy_pass $upstream_s4_auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/users/ {
        set $upstream_s4_be "http://student-4-backend:8080";
        proxy_pass $upstream_s4_be;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/students/ {
        set $upstream_s4_be "http://student-4-backend:8080";
        proxy_pass $upstream_s4_be;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/teachers/ {
        set $upstream_s4_be "http://student-4-backend:8080";
        proxy_pass $upstream_s4_be;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Grades and Progress frontend (student-5)
    location = /grades {
        return 301 /grades/;
    }
    
    location /grades/ {
        set $upstream_s5_fe "http://student-5-frontend:80";
        rewrite ^/grades/(.*)$ /$1 break;
        proxy_pass $upstream_s5_fe;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Grades and Progress API (student-5 backend)
    location /api/grades/ {
        set $upstream_s5_be "http://student-5-backend:8080";
        rewrite ^/api/grades/(.*)$ /$1 break;
        proxy_pass $upstream_s5_be;
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Canvas API gateway (shared-backend)
    location /api/canvas/ {
        set $upstream_shared_be "http://shared-backend:8080";
        proxy_pass $upstream_shared_be;
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vue Router (history mode) fallback for shell app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
