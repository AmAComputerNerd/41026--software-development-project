name: Cloud Deployment (Azure Container Apps)

on:
  push:
    branches: [main]
    paths:
      - 'infra/azure/**'
      - 'docker-compose.yml'
      - 'shared/**'
      - 'student-1/**'
      - 'student-2/**'
      - 'student-3/**'
      - 'student-4/**'
      - 'student-5/**'
      - 'ai-services/**'
      - '.github/workflows/cloud-deployment.yml'
  workflow_dispatch:
    inputs:
      deployment_profile:
        description: 'Cloud deployment profile (bonus-full enables AI Mode; baseline disables AI)'
        required: true
        default: 'bonus-full'
        type: choice
        options:
          - bonus-full
          - baseline

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: CI Pre-Deployment Verification & Baseline Flag Audit
  # ---------------------------------------------------------------------------
  validate-iac-and-tests:
    name: Validate IaC, Baseline Flags & Student 1 Tests
    runs-on: ubuntu-latest
    outputs:
      azure_credentials_configured: ${{ steps.check-creds.outputs.configured }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Azure Deployment Credentials Availability
        id: check-creds
        env:
          AZURE_CREDS: ${{ secrets.AZURE_CREDENTIALS }}
          AZURE_DEP_SECRET: ${{ secrets.AZURE_DEPLOYMENT_ENABLED }}
        run: |
          if [ -n "$AZURE_CREDS" ] || [ "$AZURE_DEP_SECRET" = "true" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate Azure Bicep Template & Deployment Script (Dry-Run)
        run: |
          chmod +x infra/azure/deploy.sh infra/azure/validate-cloud.sh
          ./infra/azure/deploy.sh --mode baseline --dry-run
          ./infra/azure/deploy.sh --mode bonus-full --dry-run

      - name: Verify Baseline Profile Disables All 4 AI Flags by Default
        run: |
          python3 - <<'PY'
          from pathlib import Path
          bicep = Path("infra/azure/main.bicep").read_text(encoding="utf-8")
          for flag in ("AI_MODE_ENABLED", "MCP_ENABLED", "RAG_ENABLED", "MULTI_AGENT_ENABLED"):
              assert flag in bicep, f"Missing {flag} in infra/azure/main.bicep"
          assert "param enableBonusAi bool = false" in bicep, "enableBonusAi must default to false"
          print("Verified: Baseline Cloud Profile disables AI_MODE, MCP, RAG, and MULTI_AGENT by default.")
          PY

      - name: Build Shared Multi-Agent Server (:5004)
        run: dotnet build ai-services/multi-agent-server/MultiAgentServer/MultiAgentServer.csproj --configuration Release -warnaserror

      - name: Run Student 1 Backend Unit & Integration Tests (Baseline + Multi-Agent)
        run: dotnet test student-1/backend/NotificationService.sln --configuration Release --verbosity normal

  # ---------------------------------------------------------------------------
  # Stage 2: Baseline Smoke Verification (AI Disabled)
  # ---------------------------------------------------------------------------
  smoke-test-baseline-container:
    name: Smoke Test Baseline Cloud Profile (AI Disabled)
    needs: validate-iac-and-tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: notifications_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # pragma: allowlist secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Student 1 Backend
        run: dotnet build student-1/backend/Api/Api.csproj --configuration Release

      - name: Run Student 1 Backend in Cloud Baseline Mode (All AI Flags False) & Execute CRUD Smoke Test
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ASPNETCORE_URLS: http://127.0.0.1:5101
          ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=5432;Database=notifications_db;Username=postgres;Password=postgres # pragma: allowlist secret
          AI_MODE_ENABLED: 'false'
          MCP_ENABLED: 'false'
          RAG_ENABLED: 'false'
          MULTI_AGENT_ENABLED: 'false'
          AiGateway__Enabled: 'false'
          McpServer__Enabled: 'false'
          RagServer__Enabled: 'false'
          MultiAgentServer__Enabled: 'false'
        run: |
          dotnet run --project student-1/backend/Api/Api.csproj --configuration Release --no-build --no-launch-profile > api.log 2>&1 &
          API_PID=$!
          trap "kill $API_PID 2>/dev/null || true" EXIT

          READY=false
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:5101/health >/dev/null 2>&1; then
              READY=true
              break
            fi
            sleep 1
          done

          if [ "$READY" != "true" ]; then
            echo "::error::Student 1 backend failed to become healthy within 45 seconds."
            echo "--- Backend log output ---"
            cat api.log || true
            exit 1
          fi

          curl -fsS http://127.0.0.1:5101/health | grep -q "Healthy"
          curl -fsS http://127.0.0.1:5101/notifications | grep -q '\['
          curl -fsS -X POST http://127.0.0.1:5101/notifications/push \
            -H "Content-Type: application/json" \
            -d '{"studentId":"00000000-0000-0000-0000-000000000001","type":"Deadline","sourceMicroservice":"system","message":"Baseline Cloud Test: CRUD works with AI disabled"}' \
            | grep -q '"sourceMicroservice":"system"'
          curl -fsS http://127.0.0.1:5101/api/notifications/multi-agent/status | grep -q '"enabled":false'
          echo "Cloud Baseline Profile CRUD + AI-Disabled verification passed."

      - name: Build Student 3 Backend and Database
        run: dotnet build student-3/backend/DeadlineTaskTracker.sln --configuration Release -warnaserror

      - name: Run Student 3 Backend in Cloud Baseline Mode (All AI Flags False) & Execute CRUD Smoke Test
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ASPNETCORE_URLS: http://127.0.0.1:5103
          DatabaseService__BaseUrl: http://127.0.0.1:5203
          SharedService__BaseUrl: http://127.0.0.1:5110
          NotificationService__BaseUrl: http://127.0.0.1:5101
          AI_MODE_ENABLED: 'false'
          MCP_ENABLED: 'false'
          RAG_ENABLED: 'false'
          MULTI_AGENT_ENABLED: 'false'
          AiGateway__Enabled: 'false'
          McpServer__Enabled: 'false'
          RagServer__Enabled: 'false'
          MultiAgentServer__Enabled: 'false'
        run: |
          set -euo pipefail
          (
            cd student-3/database/Database
            ASPNETCORE_URLS=http://127.0.0.1:5203 \
            ConnectionStrings__DefaultConnection="Data Source=$RUNNER_TEMP/student-3-cloud-baseline.db" \
            exec dotnet bin/Release/net10.0/Database.dll
          ) > "$RUNNER_TEMP/student-3-cloud-database.log" 2>&1 &
          DATABASE_PID=$!
          (
            cd student-3/backend/Api
            exec dotnet bin/Release/net10.0/Api.dll
          ) > "$RUNNER_TEMP/student-3-cloud-api.log" 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" "$DATABASE_PID" 2>/dev/null || true; wait "$API_PID" "$DATABASE_PID" 2>/dev/null || true' EXIT

          READY=false
          for _ in {1..45}; do
            if curl -fsS --max-time 3 http://127.0.0.1:5103/health/ready > /dev/null 2>&1; then
              READY=true
              break
            fi
            sleep 1
          done
          if [ "$READY" != "true" ]; then
            echo "::error::Student 3 backend failed to become healthy within 45 attempts."
            exit 1
          fi

          curl -fsS http://127.0.0.1:5103/health/ready | grep -q "Healthy"
          curl -fsS http://127.0.0.1:5103/api/tasks/ | grep -q '\['
          curl -fsS -X POST http://127.0.0.1:5103/api/tasks/ \
            -H "Content-Type: application/json" \
            -d '{"title":"Cloud baseline task","description":"CRUD works with AI disabled","priority":"Medium"}' \
            | grep -q '"title":"Cloud baseline task"'
          curl -fsS http://127.0.0.1:5103/api/integrations/capabilities \
            | grep -q '"aiModeEnabled":false,"aiBreakdownEnabled":false'
          echo "Student 3 Cloud Baseline CRUD + AI-Disabled verification passed."

      - name: Build Student 5 Backend and Database
        run: dotnet build student-5/backend/GradesManager/GradesManager.slnx --configuration Release -warnaserror

      - name: Run Student 5 Backend in Cloud Baseline Mode (All AI Flags False) & Execute CRUD Smoke Test
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ASPNETCORE_URLS: http://127.0.0.1:5105
          DatabaseService__BaseUrl: http://127.0.0.1:5205
          SharedService__BaseUrl: http://127.0.0.1:5110
          NotificationService__BaseUrl: http://127.0.0.1:5101
          AI_MODE_ENABLED: 'false'
          MCP_ENABLED: 'false'
          RAG_ENABLED: 'false'
          MULTI_AGENT_ENABLED: 'false'
          AiGateway__Enabled: 'false'
          McpServer__Enabled: 'false'
          RagServer__Enabled: 'false'
          MultiAgentServer__Enabled: 'false'
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; cat "$RUNNER_TEMP/student-5-cloud-database.log" "$RUNNER_TEMP/student-5-cloud-api.log" 2>/dev/null; exit 1; }
          (
            cd student-5/database/Database
            ASPNETCORE_URLS=http://127.0.0.1:5205 \
            ConnectionStrings__DefaultConnection="Data Source=$RUNNER_TEMP/student-5-cloud-baseline.db" \
            exec dotnet bin/Release/net10.0/Database.dll
          ) > "$RUNNER_TEMP/student-5-cloud-database.log" 2>&1 &
          DATABASE_PID=$!
          (
            cd student-5/backend/GradesManager/GradesManager
            exec dotnet bin/Release/net10.0/GradesManager.dll
          ) > "$RUNNER_TEMP/student-5-cloud-api.log" 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" "$DATABASE_PID" 2>/dev/null || true; wait "$API_PID" "$DATABASE_PID" 2>/dev/null || true' EXIT

          READY=false
          for _ in {1..45}; do
            if curl -fsS --max-time 3 http://127.0.0.1:5105/health/ready > /dev/null 2>&1; then
              READY=true
              break
            fi
            sleep 1
          done
          if [ "$READY" != "true" ]; then
            echo "::error::Student 5 backend failed to become healthy within 45 attempts."
            exit 1
          fi

          curl -fsS http://127.0.0.1:5105/health/ready | grep -q "Healthy"
          echo "── Course contract"
          courses_json=$(curl --fail --silent http://127.0.0.1:5105/api/courses) || fail "GET /api/courses failed"
          echo "$courses_json" | jq --exit-status 'type == "array" and length > 0' || fail "Course contract failed: $courses_json"
          echo "$courses_json" | jq --exit-status '.[0] | has("courseId") and has("code") and has("name")' || fail "Course contract failed: $courses_json"
          course_id=$(echo "$courses_json" | jq --exit-status --raw-output '.[0].courseId')
          echo "  course_id=$course_id"

          echo "── Student contract"
          students_json=$(curl --fail --silent http://127.0.0.1:5105/api/students/) || fail "GET /api/students/ failed"
          echo "$students_json" | jq --exit-status 'type == "array" and length > 0' || fail "Student contract failed: $students_json"
          echo "$students_json" | jq --exit-status '.[0] | has("studentId") and has("name") and has("idealMark")' || fail "Student contract failed: $students_json"
          student_id=$(echo "$students_json" | jq --exit-status --raw-output '.[0].studentId')
          echo "  student_id=$student_id"

          echo "── Assignment contract"
          assignments_json=$(curl --fail --silent "http://127.0.0.1:5105/api/assignment/student/$student_id") || fail "GET /api/assignment/student/$student_id failed"
          echo "$assignments_json" | jq --exit-status 'type == "array" and length > 0' || fail "Assignment contract failed: $assignments_json"
          echo "$assignments_json" | jq --exit-status '.[0] | has("assignmentId") and has("courseId") and has("name") and has("weight") and has("maxMark") and has("completed")' || fail "Assignment contract failed: $assignments_json"
          assignment_id=$(echo "$assignments_json" | jq --exit-status --raw-output '.[0].assignmentId')
          echo "  assignment_id=$assignment_id"

          echo "── Marks contract"
          marks_json=$(curl --fail --silent "http://127.0.0.1:5105/api/assignment/marks/$student_id") || fail "GET /api/assignment/marks/$student_id failed"
          echo "$marks_json" | jq --exit-status 'type == "array"' || fail "Marks contract failed: $marks_json"

          echo "── POST temp mark"
          post_result=$(curl --fail --silent --request POST \
              --header "Content-Type: application/json" \
              --data "{\"studentId\":\"$student_id\",\"assignmentId\":\"$assignment_id\",\"tempMark\":85}" \
              http://127.0.0.1:5105/api/assignment/marks/) || fail "POST /api/assignment/marks/ failed"
          echo "$post_result" | jq --exit-status 'has("studentId") and has("assignmentId") and has("tempMark") and .tempMark == 85' || fail "POST contract failed: $post_result"

          echo "── PUT temp mark"
          put_result=$(curl --fail --silent --request PUT \
              --header "Content-Type: application/json" \
              --data "{\"studentId\":\"$student_id\",\"assignmentId\":\"$assignment_id\",\"tempMark\":92}" \
              http://127.0.0.1:5105/api/assignment/marks/) || fail "PUT /api/assignment/marks/ failed"
          echo "$put_result" | jq --exit-status 'has("studentId") and has("assignmentId") and has("tempMark") and .tempMark == 92' || fail "PUT contract failed: $put_result"

          echo "── DELETE temp mark"
          delete_status=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              --request DELETE \
              "http://127.0.0.1:5105/api/assignment/marks/$student_id/$assignment_id")
          test "$delete_status" = "204" || fail "DELETE returned $delete_status (expected 204)"

          echo "── Integrations capabilities"
          caps_json=$(curl --fail --silent http://127.0.0.1:5105/api/integrations/capabilities) || fail "GET /api/integrations/capabilities failed"
          echo "$caps_json" | jq --exit-status '.AiModeEnabled == false and .MultiAgentEnabled == false' || fail "Capabilities contract failed: $caps_json"

          echo "Student 5 Cloud Baseline CRUD + AI-Disabled verification passed."

  # ---------------------------------------------------------------------------
  # Stage 3: Azure Container Apps Deployment (Triggered when AZURE_CREDENTIALS configured)
  # ---------------------------------------------------------------------------
  deploy-to-azure:
    name: Deploy to Azure Container Apps
    needs: [validate-iac-and-tests, smoke-test-baseline-container]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && vars.AZURE_DEPLOYMENT_ENABLED != 'false' && (vars.AZURE_DEPLOYMENT_ENABLED == 'true' || needs.validate-iac-and-tests.outputs.azure_credentials_configured == 'true') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Execute Azure Container Apps Deployment
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-better-canvas-r2' }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'australiaeast' }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME || 'acrbettercanvasr2' }}
          IMAGE_TAG: ${{ github.sha }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'nvidia/nemotron-3.5-lightning:free' }}
          CANVAS_API_TOKEN: ${{ secrets.CANVAS_API_TOKEN }}
        run: |
          chmod +x infra/azure/deploy.sh
          PROFILE="${{ inputs.deployment_profile || vars.DEPLOYMENT_PROFILE || 'bonus-full' }}"
          ./infra/azure/deploy.sh --mode "$PROFILE"
