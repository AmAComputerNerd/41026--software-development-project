name: Student 2 - CI

on:
  push:
    branches: [main]
    paths:
      - "student-2/backend/**"
      - "student-2/frontend/**"
      - "shared/ui-kit/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/student-2.yml"
  pull_request:
    paths:
      - "student-2/backend/**"
      - "student-2/frontend/**"
      - "shared/ui-kit/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/student-2.yml"

concurrency:
  group: student-2-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  BACKEND_DIR: student-2/backend/Api
  DOTNET_SOLUTION: student-2/backend/AutomationsService.slnx
  AiGateway__Enabled: "false"
  McpServer__Enabled: "false"
  RagServer__Enabled: "false"
  MultiAgentServer__Enabled: "false"

jobs:
  frontend-build:
    name: Frontend type check & production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Type check and build
        run: npm run build --workspace=student-2-frontend

      - name: Audit production dependencies
        run: npm audit --workspace=student-2-frontend --omit=dev --audit-level=high

  backend-build:
    name: Backend build, endpoint tests, analyze & format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('student-2/backend/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore "${{ env.DOTNET_SOLUTION }}"

      - name: Build (Release, warnings as errors)
        run: dotnet build "${{ env.DOTNET_SOLUTION }}" --configuration Release --no-restore -warnaserror

      - name: Post-Commit CI/CD Endpoint Tests (Endpoint 1 /api/automations & Endpoint 2 /api/automation-runs/{id}/quiz-review)
        run: >-
          dotnet test "${{ env.DOTNET_SOLUTION }}" --configuration Release --no-build
          --filter "FullyQualifiedName~AutomationEndpointsTests|FullyQualifiedName~QuizReviewEndpointsTests"
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=student-2-endpoint-tests.trx"
          --results-directory TestResults

      - name: Upload endpoint test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-2-endpoint-tests
          path: TestResults/*.trx

      - name: Verify AI Mode, MCP, RAG and Multi-Agent are disabled
        shell: bash
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          ASPNETCORE_URLS=http://127.0.0.1:5122 \
            dotnet run --configuration Release --no-build --no-launch-profile &
          backend_pid=$!
          trap 'kill "$backend_pid"' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5122/health/ready > /dev/null; then
              break
            fi
            sleep 1
          done

          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' \
            --data '{"days":30}' \
            http://127.0.0.1:5122/api/integrations/mcp/automation-health)" = "503"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' \
            --data '{"question":"How do automations work?"}' \
            http://127.0.0.1:5122/api/integrations/rag/query)" = "503"
          curl --fail --silent http://127.0.0.1:5122/api/integrations/capabilities \
            | grep -q '"multiAgentEnabled":false'

      - name: Verify code formatting
        run: dotnet format "${{ env.DOTNET_SOLUTION }}" --verify-no-changes --severity warn --no-restore

  ef-core-migrations-check:
    name: EF Core migrations drift check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore
        working-directory: ${{ env.BACKEND_DIR }}

      - name: Install matching EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.11

      - name: Check for pending model changes
        run: dotnet ef migrations has-pending-model-changes
        working-directory: ${{ env.BACKEND_DIR }}

  vulnerability-scan:
    name: NuGet vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore
        working-directory: ${{ env.BACKEND_DIR }}

      - name: Scan for known-vulnerable packages
        shell: bash
        run: |
          set -o pipefail
          dotnet list package --vulnerable --include-transitive | tee vulnerability-report.txt
          if grep -qi "has the following vulnerable packages" vulnerability-report.txt; then
            echo "::error::Vulnerable NuGet packages detected."
            exit 1
          fi
        working-directory: ${{ env.BACKEND_DIR }}
