name: Docker - CI

on:
  push:
    branches: [main]
    paths:
      - "ai-services/**"
      - "shared/**"
      - "student-*/**"
      - "docker-compose.yml"
      - "package.json"
      - "package-lock.json"
      - ".env.example"
      - "tools/setup_env.py"
      - "tools/run_ai_services.py"
      - ".github/workflows/docker-ci.yml"
  pull_request:
    paths:
      - "ai-services/**"
      - "shared/**"
      - "student-*/**"
      - "docker-compose.yml"
      - "package.json"
      - "package-lock.json"
      - ".env.example"
      - "tools/setup_env.py"
      - "tools/run_ai_services.py"
      - ".github/workflows/docker-ci.yml"

concurrency:
  group: docker-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENROUTER_API_KEY: ci-placeholder
  CANVAS_BASE_URL: https://canvas.example.invalid
  CANVAS_API_TOKEN: ci-placeholder

jobs:
  compose-contract:
    name: Compose contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      services: ${{ steps.discover.outputs.services }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Compose environment
        run: |
          cat << 'EOF' > .env
          OPENROUTER_API_KEY="ci-placeholder"
          OPENROUTER_MODEL=ci-placeholder
          CANVAS_BASE_URL=https://canvas.example.invalid
          CANVAS_API_TOKEN="ci-placeholder"
          MCP_ENABLED=false
          RAG_ENABLED=false
          AI_MODE_ENABLED=false
          AI_MODE_HOST_PORT=5001
          MCP_HOST_PORT=5002
          RAG_HOST_PORT=5003
          MULTI_AGENT_ENABLED=false
          MULTI_AGENT_HOST_PORT=5004
          EOF
          python -c 'import secrets; print("POSTGRES_PASSWORD=" + secrets.token_hex(32))' >> .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Verify AI service boundaries
        shell: bash
        run: |
          set -euo pipefail

          config=$(docker compose config --format json)
          jq --exit-status '
            . as $config |
            (["ai-mode", "mcp-server", "rag-server", "multi-agent-server"] | all(
              . as $service | $config.services | has($service) | not
            )) and
            ([.services | to_entries[] |
              select(.value.environment | has("OPENROUTER_API_KEY")) | .key] == []) and
            (.networks | has("ai-services") | not) and
            ([1, 2, 3, 4, 5] | all(
              . as $student |
              $config.services["student-\($student)-backend"] as $backend |
              ($backend.environment.AiGateway__BaseUrl == "http://host.docker.internal:5001") and
              ($backend.environment.McpServer__BaseUrl == "http://host.docker.internal:5002/mcp") and
              ($backend.environment.RagServer__BaseUrl == "http://host.docker.internal:5003") and
              ($backend.extra_hosts == ["host.docker.internal=host-gateway"])
            )) and
            (.services["student-1-backend"].environment.MultiAgentServer__Enabled == "false") and
            (.services["student-1-backend"].environment.MultiAgentServer__BaseUrl |
              startswith("http://host.docker.internal:")) and
            (.services["student-3-backend"].environment.McpServer__Enabled == "false") and
            (.services["student-3-backend"].environment.MultiAgentServer__Enabled == "false") and
            (.services["student-3-backend"].environment.MultiAgentServer__BaseUrl |
              startswith("http://host.docker.internal:")) and
            (.services["student-3-backend"].environment.RagServer__Enabled == "false") and
            (.services["student-4-backend"].environment.McpServer__Enabled == "false") and
            (.services["student-4-backend"].environment.RagServer__Enabled == "false")
          ' <<< "$config" > /dev/null

          python -m unittest discover -s tools/tests

      - name: Verify Student 3 database isolation
        shell: bash
        run: |
          set -euo pipefail

          config=$(docker compose config --format json)
          jq --exit-status '
            .networks["student-3-data"].internal == true and
            (.services["student-3-database"].networks | keys == ["student-3-data"]) and
            (.services["student-3-database"] | has("ports") | not) and
            (.services["student-3-backend"].networks | has("default")) and
            (.services["student-3-backend"].networks | has("student-3-data")) and
            (.services["student-3-backend"].depends_on | has("student-1-backend") | not)
          ' <<< "$config" > /dev/null

      - name: Discover buildable services
        id: discover
        shell: bash
        run: |
          set -euo pipefail

          services=$(
            docker compose config --format json |
              jq --compact-output '
                [.services | to_entries[] | select(.value.build != null) | .key] | sort
              '
          )
          test "$(jq length <<< "$services")" -gt 0
          echo "services=$services" >> "$GITHUB_OUTPUT"
          jq --raw-output '.[]' <<< "$services"

  build-images:
    name: Build image (${{ matrix.service }})
    needs: compose-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        service: ${{ fromJSON(needs.compose-contract.outputs.services) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Compose environment
        run: |
          cat << 'EOF' > .env
          OPENROUTER_API_KEY="ci-placeholder"
          OPENROUTER_MODEL=ci-placeholder
          CANVAS_BASE_URL=https://canvas.example.invalid
          CANVAS_API_TOKEN="ci-placeholder"
          MCP_ENABLED=false
          RAG_ENABLED=false
          AI_MODE_ENABLED=false
          AI_MODE_HOST_PORT=5001
          MCP_HOST_PORT=5002
          RAG_HOST_PORT=5003
          MULTI_AGENT_ENABLED=false
          MULTI_AGENT_HOST_PORT=5004
          EOF
          python -c 'import secrets; print("POSTGRES_PASSWORD=" + secrets.token_hex(32))' >> .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }}
        uses: docker/bake-action@v6
        with:
          files: docker-compose.yml
          targets: ${{ matrix.service }}
          set: |
            ${{ matrix.service }}.cache-from=type=gha,scope=${{ matrix.service }}
            ${{ matrix.service }}.cache-to=type=gha,mode=max,scope=${{ matrix.service }}

  build-cloud-ai-images:
    name: Build optional cloud image (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - service: ai-mode
            context: ./ai-services/ai-mode
            dockerfile: ai-services/ai-mode/Api/Dockerfile
          - service: mcp-server
            context: ./ai-services/mcp-server
            dockerfile: ai-services/mcp-server/McpServer/Dockerfile
          - service: rag-server
            context: .
            dockerfile: ai-services/rag-server/RagServer/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build optional cloud AI image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=cloud-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=cloud-${{ matrix.service }}

  student-3-integration:
    name: Student 3 Compose integration
    needs: compose-contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Create Compose environment
        run: |
          cat << 'EOF' > .env
          OPENROUTER_API_KEY="ci-placeholder"
          OPENROUTER_MODEL=ci-placeholder
          CANVAS_BASE_URL=https://canvas.example.invalid
          CANVAS_API_TOKEN="ci-placeholder"
          MCP_ENABLED=false
          RAG_ENABLED=false
          AI_MODE_ENABLED=false
          AI_MODE_HOST_PORT=5001
          MCP_HOST_PORT=5002
          RAG_HOST_PORT=5003
          MULTI_AGENT_ENABLED=false
          MULTI_AGENT_HOST_PORT=5004
          EOF
          python -c 'import secrets; print("POSTGRES_PASSWORD=" + secrets.token_hex(32))' >> .env

      - name: Start Student 3 core services
        run: |
          docker compose up \
            --build \
            --detach \
            student-3-database \
            student-3-backend

      - name: Verify startup without optional integrations
        shell: bash
        run: |
          set -euo pipefail

          for service in student-1-backend shared-backend ai-mode; do
            if docker compose ps --all --services |
              grep --fixed-strings --line-regexp "$service"; then
              echo "::error::$service was started as a Student 3 dependency."
              exit 1
            fi
          done

          for _ in {1..30}; do
            if docker compose exec -T student-3-database \
                curl --fail --silent --max-time 5 \
                  http://localhost:8080/health/ready > /dev/null &&
              curl --fail --silent --max-time 5 \
                http://127.0.0.1:5103/health/ready > /dev/null; then
              exit 0
            fi
            sleep 2
          done

          exit 1

      - name: Verify database readiness dependency
        shell: bash
        run: |
          set -euo pipefail

          docker compose stop student-3-database
          status=""
          for _ in {1..10}; do
            status=$(
              curl --silent --max-time 5 --output /dev/null \
                --write-out "%{http_code}" \
                http://127.0.0.1:5103/health/ready || true
            )
            if [[ "$status" == "503" ]]; then
              exit 0
            fi
            sleep 1
          done

          exit 1

      - name: Start host AI services
        shell: bash
        run: |
          for project in \
            ai-services/ai-mode/Api/Api.csproj \
            ai-services/mcp-server/McpServer/McpServer.csproj \
            ai-services/rag-server/RagServer/RagServer.csproj \
            ai-services/multi-agent-server/MultiAgentServer/MultiAgentServer.csproj; do
            dotnet build "$project" -warnaserror
          done
          python -u tools/run_ai_services.py > host-ai.log 2>&1 &
          echo "$!" > "$RUNNER_TEMP/host-ai.pid"

      - name: Verify host AI readiness and staged corpus from Docker
        shell: bash
        run: |
          set -euo pipefail
          for port in 5001 5002 5003 5004; do
            ready=false
            for _ in {1..120}; do
              if docker compose exec -T student-3-backend \
                  curl --fail --silent --max-time 3 \
                    "http://host.docker.internal:$port/health/ready"; then
                ready=true
                break
              fi
              kill -0 "$(cat "$RUNNER_TEMP/host-ai.pid")"
              sleep 2
            done
            test "$ready" = true
          done
          docker compose exec -T student-3-backend \
            curl --fail --silent --show-error http://host.docker.internal:5003/ |
            jq --exit-status '.sources == 10 and .chunks > 0'
          docker compose exec -T student-3-backend curl --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --data '{"question":"zzzzzzzzzzzzzzzzzzzzzzzz","scope":"student-3"}' \
            http://host.docker.internal:5003/api/answers |
            jq --exit-status '.status == "insufficient_context"'

      - name: Verify host MCP callback to the containerised backend
        shell: bash
        run: |
          set -euo pipefail
          MCP_ENABLED=true docker compose up --detach --wait student-3-backend
          docker compose exec -T student-3-backend curl --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --data '{"days":7,"limit":1}' \
            http://localhost:8080/api/integrations/mcp/upcoming-deadlines |
            jq --exit-status '.status == "success" and .tool == "deadlines_list_upcoming"'

      - name: Show smoke-test logs on failure
        if: failure()
        run: |
          docker compose logs student-3-database student-3-backend
          if [[ -f host-ai.log ]]; then cat host-ai.log; fi

      - name: Stop smoke-test services
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/host-ai.pid" ]]; then
            launcher_pid=$(cat "$RUNNER_TEMP/host-ai.pid")
            kill -TERM "$launcher_pid" 2>/dev/null || true
          fi
          docker compose down --volumes

  docker-ci-complete:
    name: Validate Compose & build images
    if: ${{ !cancelled() }}
    needs:
      - compose-contract
      - build-images
      - build-cloud-ai-images
      - student-3-integration
    runs-on: ubuntu-latest
    steps:
      - name: Require successful Docker checks
        env:
          COMPOSE_RESULT: ${{ needs.compose-contract.result }}
          BUILD_RESULT: ${{ needs.build-images.result }}
          CLOUD_AI_RESULT: ${{ needs.build-cloud-ai-images.result }}
          INTEGRATION_RESULT: ${{ needs.student-3-integration.result }}
        run: |
          test "$COMPOSE_RESULT" = "success"
          test "$BUILD_RESULT" = "success"
          test "$CLOUD_AI_RESULT" = "success"
          test "$INTEGRATION_RESULT" = "success"
