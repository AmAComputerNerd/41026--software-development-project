name: Docker - CI

on:
  push:
    branches: [main]
    paths:
      - "ai-services/**"
      - "shared/**"
      - "student-1/**"
      - "student-2/**"
      - "student-3/**"
      - "student-4/**"
      - "student-5/**"
      - "docker-compose.yml"
      - "package.json"
      - "package-lock.json"
      - ".env.example"
      - ".github/workflows/docker-ci.yml"
  pull_request:
    paths:
      - "ai-services/**"
      - "shared/**"
      - "student-1/**"
      - "student-2/**"
      - "student-3/**"
      - "student-4/**"
      - "student-5/**"
      - "docker-compose.yml"
      - "package.json"
      - "package-lock.json"
      - ".env.example"
      - ".github/workflows/docker-ci.yml"

concurrency:
  group: docker-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENROUTER_API_KEY: ci-placeholder
  CANVAS_BASE_URL: https://canvas.example.invalid
  CANVAS_API_TOKEN: ci-placeholder

jobs:
  compose-validation:
    name: Validate Compose & build images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env file for docker compose
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build all service images
        run: docker compose build

      - name: Verify dependency health and startup ordering
        shell: bash
        run: |
          set -euo pipefail

          docker compose up --detach shared-backend ai-mode student-1-backend student-3-backend

          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5101/health/live > /dev/null &&
              curl --fail --silent http://127.0.0.1:5103/health/ready > /dev/null; then
              break
            fi
            sleep 2
          done

          curl --fail --silent http://127.0.0.1:5101/health/live > /dev/null
          curl --fail --silent http://127.0.0.1:5103/health/ready > /dev/null

          docker compose stop ai-mode
          for _ in {1..10}; do
            status=$(
              curl --silent --output /dev/null --write-out "%{http_code}" \
                http://127.0.0.1:5103/health/ready
            )
            if [[ "$status" == "503" ]]; then
              break
            fi
            sleep 1
          done
          test "$status" = "503"

          docker compose start ai-mode
          for _ in {1..20}; do
            if curl --fail --silent http://127.0.0.1:5103/health/ready > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          docker compose ps
          docker compose logs shared-backend ai-mode student-1-backend student-3-backend
          exit 1

      - name: Stop smoke-test services
        if: always()
        run: docker compose down --volumes
