name: Docker - CI

on:
  push:
    branches: [main]
    paths:
      - "ai-services/**"
      - "shared/**"
      - "student-*/**"
      - "docker-compose.yml"
      - "package.json"
      - "package-lock.json"
      - ".env.example"
      - ".github/workflows/docker-ci.yml"
  pull_request:
    paths:
      - "ai-services/**"
      - "shared/**"
      - "student-*/**"
      - "docker-compose.yml"
      - "package.json"
      - "package-lock.json"
      - ".env.example"
      - ".github/workflows/docker-ci.yml"

concurrency:
  group: docker-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENROUTER_API_KEY: ci-placeholder
  CANVAS_BASE_URL: https://canvas.example.invalid
  CANVAS_API_TOKEN: ci-placeholder

jobs:
  compose-contract:
    name: Compose contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      services: ${{ steps.discover.outputs.services }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Compose environment
        run: |
          cat << 'EOF' > .env
          OPENROUTER_API_KEY=ci-placeholder
          CANVAS_BASE_URL=https://canvas.example.invalid
          CANVAS_API_TOKEN=ci-placeholder
          EOF

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Verify Student 3 database isolation
        shell: bash
        run: |
          set -euo pipefail

          config=$(docker compose config --format json)
          jq --exit-status '
            .networks["student-3-data"].internal == true and
            (.services["student-3-database"].networks | keys == ["student-3-data"]) and
            (.services["student-3-database"] | has("ports") | not) and
            (.services["student-3-backend"].networks | has("default")) and
            (.services["student-3-backend"].networks | has("student-3-data")) and
            (.services["student-3-backend"].depends_on | has("student-1-backend") | not)
          ' <<< "$config" > /dev/null

      - name: Discover buildable services
        id: discover
        shell: bash
        run: |
          set -euo pipefail

          services=$(
            docker compose config --format json |
              jq --compact-output '
                [.services | to_entries[] | select(.value.build != null) | .key] | sort
              '
          )
          test "$(jq length <<< "$services")" -gt 0
          echo "services=$services" >> "$GITHUB_OUTPUT"
          jq --raw-output '.[]' <<< "$services"

  build-images:
    name: Build image (${{ matrix.service }})
    needs: compose-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        service: ${{ fromJSON(needs.compose-contract.outputs.services) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Compose environment
        run: |
          cat << 'EOF' > .env
          OPENROUTER_API_KEY=ci-placeholder
          CANVAS_BASE_URL=https://canvas.example.invalid
          CANVAS_API_TOKEN=ci-placeholder
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }}
        uses: docker/bake-action@v6
        with:
          files: docker-compose.yml
          targets: ${{ matrix.service }}
          set: |
            ${{ matrix.service }}.cache-from=type=gha,scope=${{ matrix.service }}
            ${{ matrix.service }}.cache-to=type=gha,mode=max,scope=${{ matrix.service }}

  student-3-integration:
    name: Student 3 Compose integration
    needs: compose-contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Compose environment
        run: |
          cat << 'EOF' > .env
          OPENROUTER_API_KEY=ci-placeholder
          CANVAS_BASE_URL=https://canvas.example.invalid
          CANVAS_API_TOKEN=ci-placeholder
          EOF

      - name: Start Student 3 dependency stack
        run: |
          docker compose up \
            --build \
            --detach \
            shared-backend \
            ai-mode \
            student-3-database \
            student-3-backend

      - name: Verify startup without notification service
        shell: bash
        run: |
          set -euo pipefail

          if docker compose ps --all --services |
            grep --fixed-strings --line-regexp student-1-backend; then
            echo "::error::student-1-backend was started as a Student 3 dependency."
            exit 1
          fi

          for _ in {1..30}; do
            if docker compose exec -T student-3-database \
                curl --fail --silent --max-time 5 \
                  http://localhost:8080/health/ready > /dev/null &&
              curl --fail --silent --max-time 5 \
                http://127.0.0.1:5103/health/ready > /dev/null; then
              exit 0
            fi
            sleep 2
          done

          exit 1

      - name: Verify AI gateway readiness dependency
        shell: bash
        run: |
          set -euo pipefail

          docker compose stop ai-mode
          status=""
          for _ in {1..10}; do
            status=$(
              curl --silent --max-time 5 --output /dev/null \
                --write-out "%{http_code}" \
                http://127.0.0.1:5103/health/ready || true
            )
            if [[ "$status" == "503" ]]; then
              break
            fi
            sleep 1
          done
          test "$status" = "503"

          docker compose start ai-mode
          for _ in {1..20}; do
            if curl --fail --silent --max-time 5 \
              http://127.0.0.1:5103/health/ready > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          exit 1

      - name: Verify database readiness dependency
        shell: bash
        run: |
          set -euo pipefail

          docker compose stop student-3-database
          status=""
          for _ in {1..10}; do
            status=$(
              curl --silent --max-time 5 --output /dev/null \
                --write-out "%{http_code}" \
                http://127.0.0.1:5103/health/ready || true
            )
            if [[ "$status" == "503" ]]; then
              exit 0
            fi
            sleep 1
          done

          exit 1

      - name: Show smoke-test logs on failure
        if: failure()
        run: docker compose logs shared-backend ai-mode student-3-database student-3-backend

      - name: Stop smoke-test services
        if: always()
        run: docker compose down --volumes

  docker-ci-complete:
    name: Validate Compose & build images
    if: ${{ !cancelled() }}
    needs:
      - compose-contract
      - build-images
      - student-3-integration
    runs-on: ubuntu-latest
    steps:
      - name: Require successful Docker checks
        env:
          COMPOSE_RESULT: ${{ needs.compose-contract.result }}
          BUILD_RESULT: ${{ needs.build-images.result }}
          INTEGRATION_RESULT: ${{ needs.student-3-integration.result }}
        run: |
          test "$COMPOSE_RESULT" = "success"
          test "$BUILD_RESULT" = "success"
          test "$INTEGRATION_RESULT" = "success"
