name: Student 3 - CI

on:
  push:
    branches: [main]
    paths:
      - "student-3/backend/**"
      - "student-3/frontend/**"
      - "shared/ui-kit/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/student-3-ci.yml"
  pull_request:
    paths:
      - "student-3/backend/**"
      - "student-3/frontend/**"
      - "shared/ui-kit/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/student-3-ci.yml"

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: student-3-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  WORKING_DIR: student-3/backend/Api

jobs:
  frontend-build:
    name: Frontend type check & production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Type check and build
        run: npm run build --workspace=student-3-frontend

  build-and-analyze:
    name: Build, analyze & format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('student-3/backend/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore
        working-directory: ${{ env.WORKING_DIR }}

      - name: Build (Release, warnings as errors)
        run: dotnet build --configuration Release --no-restore -warnaserror
        working-directory: ${{ env.WORKING_DIR }}

      - name: Verify code formatting
        run: dotnet format --verify-no-changes --severity warn
        working-directory: ${{ env.WORKING_DIR }}

  frontend-backend-contract:
    name: API contract & browser CORS smoke test
    needs: [frontend-build, build-and-analyze]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore and build API
        run: |
          dotnet restore
          dotnet build --configuration Release --no-restore -warnaserror
        working-directory: ${{ env.WORKING_DIR }}

      - name: Verify frontend task contract and CORS
        shell: bash
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          set -euo pipefail

          dotnet run \
            --configuration Release \
            --no-build \
            --no-launch-profile \
            --urls http://127.0.0.1:5103 > api.log 2>&1 &
          api_pid=$!
          task_id=""

          cleanup() {
            if [[ -n "$task_id" ]]; then
              curl --silent --request DELETE \
                "http://127.0.0.1:5103/api/tasks/$task_id" > /dev/null || true
            fi
            kill "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in {1..30}; do
            if curl --fail --silent \
              http://127.0.0.1:5103/api/courses/ > courses.json; then
              break
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat api.log
              exit 1
            fi
            sleep 1
          done
          test -s courses.json

          created=$(
            curl --fail --silent \
              --request POST \
              --header "Content-Type: application/json" \
              --data '{
                "title": "CI frontend contract",
                "description": "Created with the frontend request shape",
                "dueDate": "2030-01-02T03:04:05Z",
                "priority": "High",
                "courseId": null,
                "parentTaskId": null
              }' \
              http://127.0.0.1:5103/api/tasks/
          )
          task_id=$(jq --exit-status --raw-output '.id' <<< "$created")
          jq --exit-status '
            .title == "CI frontend contract" and
            .priority == "High" and
            .status == "Todo" and
            .dueDate != null
          ' <<< "$created" > /dev/null

          updated=$(
            curl --fail --silent \
              --request PUT \
              --header "Content-Type: application/json" \
              --data '{
                "newTitle": null,
                "updateDescription": false,
                "newDescription": null,
                "updateDueDate": true,
                "newDueDate": null,
                "newPriority": "Medium",
                "newStatus": "InProgress"
              }' \
              "http://127.0.0.1:5103/api/tasks/$task_id"
          )
          jq --exit-status '
            .dueDate == null and
            .priority == "Medium" and
            .status == "InProgress"
          ' <<< "$updated" > /dev/null

          curl --fail --silent \
            --request OPTIONS \
            --header "Origin: http://localhost:3003" \
            --header "Access-Control-Request-Method: PUT" \
            --dump-header cors-headers.txt \
            --output /dev/null \
            "http://127.0.0.1:5103/api/tasks/$task_id"
          grep --ignore-case \
            "^Access-Control-Allow-Origin: http://localhost:3003" \
            cors-headers.txt
          grep --ignore-case \
            "^Access-Control-Allow-Methods:.*PUT" \
            cors-headers.txt

  ef-core-migrations-check:
    name: EF Core migrations drift check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('student-3/backend/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore
        working-directory: ${{ env.WORKING_DIR }}

      - name: Install dotnet-ef (matching project's EF Core version)
        run: dotnet tool install --global dotnet-ef --version 10.0.11

      # Fails the build if the current model has diverged from the latest
      # migration snapshot (e.g. an entity property changed without a
      # corresponding `dotnet ef migrations add`).
      - name: Check for pending model changes
        run: dotnet ef migrations has-pending-model-changes
        working-directory: ${{ env.WORKING_DIR }}

  vulnerability-scan:
    name: NuGet vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore
        working-directory: ${{ env.WORKING_DIR }}

      # `dotnet list package --vulnerable` exits 0 even when vulnerabilities are
      # found, so grep the output to fail the job when any are reported.
      - name: Scan for known-vulnerable packages
        run: |
          set -o pipefail
          dotnet list package --vulnerable --include-transitive | tee vuln-report.txt
          if grep -qi "has the following vulnerable packages" vuln-report.txt; then
            echo "::error::Vulnerable NuGet packages detected. See log above."
            exit 1
          fi
        working-directory: ${{ env.WORKING_DIR }}
