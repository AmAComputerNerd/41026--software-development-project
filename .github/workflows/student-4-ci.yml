name: Student 4 - CI

on:
  push:
    branches: [main]
    paths:
      - "student-4/backend/**"
      - "student-4/frontend/**"
      - "shared/ui-kit/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/student-4-ci.yml"
  pull_request:
    paths:
      - "student-4/backend/**"
      - "student-4/frontend/**"
      - "shared/ui-kit/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/student-4-ci.yml"

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: student-4-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  WORKING_DIR: student-4/backend/Api

jobs:
  frontend-build:
    name: Frontend type check & production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Type check and build
        run: npm run build --workspace=student-4-frontend

  build-and-analyze:
    name: Build, analyze & format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('student-4/backend/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore
        working-directory: ${{ env.WORKING_DIR }}

      - name: Build (Release, warnings as errors)
        run: dotnet build --configuration Release --no-restore -warnaserror
        working-directory: ${{ env.WORKING_DIR }}

      - name: Verify code formatting
        run: dotnet format --verify-no-changes --severity warn
        working-directory: ${{ env.WORKING_DIR }}