name: Student 4 - CI

on:
  push:
    branches: [main]
    paths:
      - "student-4/authentication/**"
      - "student-4/backend/**"
      - "student-4/contracts/**"
      - "student-4/database/**"
      - "student-4/frontend/**"
      - "shared/ui-kit/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/student-4-ci.yml"
  pull_request:
    paths:
      - "student-4/backend/**"
      - "student-4/contracts/**"
      - "student-4/database/**"
      - "student-4/frontend/**"
      - "shared/ui-kit/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/student-4-ci.yml"

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: student-4-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SOLUTION: student-4/backend/AccountService.sln
  API_PROJECT: student-4/backend/Api/Api.csproj
  DATABASE_PROJECT: student-4/database/Database/Database.csproj
  McpServer__Enabled: "false"
  RagServer__Enabled: "false"

jobs:
  frontend-build:
    name: Frontend type check & production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Type check and build
        run: npm run build --workspace=student-4-frontend

  build-and-analyze:
    name: Build, analyze & format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('student-4/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore "${{ env.DOTNET_SOLUTION }}"

      - name: Build (Release, warnings as errors)
        run: dotnet build "${{ env.DOTNET_SOLUTION }}" --configuration Release --no-restore -warnaserror

      - name: Verify code formatting
        run: dotnet format "${{ env.DOTNET_SOLUTION }}" --verify-no-changes --severity warn

  account-api-contract:
    name: Account API & disabled MCP/RAG smoke test
    needs: build-and-analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Build services
        run: dotnet build "${{ env.DOTNET_SOLUTION }}" --configuration Release -warnaserror
      - name: Verify account reads and disabled MCP
        shell: bash
        run: |
          set -euo pipefail
          ASPNETCORE_URLS=http://127.0.0.1:5204 \
          ConnectionStrings__DefaultConnection="Data Source=$RUNNER_TEMP/student-4-ci.db" \
          dotnet run --project "${{ env.DATABASE_PROJECT }}" \
            --configuration Release --no-build --no-launch-profile > database.log 2>&1 &
          database_pid=$!
          api_pid=""
          cleanup() {
            if [[ -n "$api_pid" ]]; then kill "$api_pid" 2>/dev/null || true; fi
            kill "$database_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for _ in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5204/health/ready > /dev/null; then break; fi
            if ! kill -0 "$database_pid" 2>/dev/null; then cat database.log; exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5204/health/ready > /dev/null
          ASPNETCORE_URLS=http://127.0.0.1:5104 \
          DatabaseService__BaseUrl=http://127.0.0.1:5204 \
          SharedService__BaseUrl=http://127.0.0.1:5110 \
          AiGateway__BaseUrl=http://127.0.0.1:5001 \
          NotificationService__BaseUrl=http://127.0.0.1:5101 \
          dotnet run --project "${{ env.API_PROJECT }}" \
            --configuration Release --no-build --no-launch-profile > api.log 2>&1 &
          api_pid=$!
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5104/health/ready > /dev/null; then break; fi
            if ! kill -0 "$api_pid" 2>/dev/null; then cat api.log; exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5104/health/ready > /dev/null
          user_id=$(curl --fail --silent http://127.0.0.1:5104/api/users/ | jq -er '.[0].id')
          curl --fail --silent "http://127.0.0.1:5104/api/users/$user_id" |
            jq -e --arg id "$user_id" '.id == $id' > /dev/null
          status=$(curl --silent --output mcp.json --write-out "%{http_code}" \
            --request POST "http://127.0.0.1:5104/api/users/$user_id/mcp-readiness")
          test "$status" = "503"
          jq -e '.detail == "MCP integration is disabled for this environment."' mcp.json > /dev/null
          status=$(curl --silent --output rag.json --write-out "%{http_code}" \
            --request POST --header "Content-Type: application/json" \
            --data '{"question":"How do I reset my password?"}' \
            "http://127.0.0.1:5104/api/users/help/answers")
          test "$status" = "503"
          jq -e '.detail == "RAG integration is disabled for this environment."' rag.json > /dev/null
          status=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --request POST --header "Content-Type: application/json" --data '{"question":" "}' \
            "http://127.0.0.1:5104/api/users/help/answers")
          test "$status" = "400"
          status=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            "http://127.0.0.1:5104/internal/ai-context/accounts/$user_id/readiness")
          test "$status" = "503"
      - name: Show logs on failure
        if: failure()
        run: cat database.log api.log 2>/dev/null || true

  ef-core-migrations-check:
    name: EF Core migrations drift check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('student-4/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore "${{ env.DATABASE_PROJECT }}"

      - name: Install dotnet-ef (matching project's EF Core version)
        run: dotnet tool install --global dotnet-ef --version 10.0.11

      # Fails the build if the current model has diverged from the latest
      # migration snapshot (e.g. an entity property changed without a
      # corresponding `dotnet ef migrations add`).
      - name: Check for pending model changes
        run: dotnet ef migrations has-pending-model-changes --project "${{ env.DATABASE_PROJECT }}"

  vulnerability-scan:
    name: NuGet vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.DOTNET_SOLUTION }}"

      # `dotnet list package --vulnerable` exits 0 even when vulnerabilities are
      # found, so grep the output to fail the job when any are reported.
      - name: Scan for known-vulnerable packages
        run: |
          set -o pipefail
          dotnet list "${{ env.DOTNET_SOLUTION }}" package --vulnerable --include-transitive | tee vuln-report.txt
          if grep -qi "has the following vulnerable packages" vuln-report.txt; then
            echo "::error::Vulnerable NuGet packages detected. See log above."
            exit 1
          fi
